name: Publish to npm

# Publishes when you create a GitHub Release (or run manually).
#
# Auth: npm Trusted Publishing (OIDC) — NO GitHub Environment, NO NPM_TOKEN.
# One-time setup on https://www.npmjs.com/package/agent-pipx → Settings → Trusted Publisher:
#   Organization or user : kyizinlatt
#   Repository           : agent-pipx
#   Workflow filename    : publish.yml
#   Environment name     : (leave BLANK — this repo does not use GitHub Environments)
#   Allowed actions      : npm publish
#
# Requires npm CLI ≥ 11.5.1 for OIDC. Provenance is attached automatically with trusted publishing.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC for npm trusted publishing + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    # Intentionally no `environment:` — repo secrets / Environments are not used for publish.
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      # Trusted publishing needs npm ≥ 11.5.1 (Node 22 ships an older npm).
      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@latest

      - name: Test before publish
        run: node --test

      - name: Publish (public, provenance via OIDC)
        # Do NOT set NODE_AUTH_TOKEN — an empty token makes npm skip OIDC and fail with ENEEDAUTH.
        run: npm publish --provenance --access public
