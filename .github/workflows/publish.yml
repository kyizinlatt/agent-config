name: Publish to npm

# Publishes when you create a GitHub Release (or run manually). Publishing from CI with
# --provenance attaches a signed Sigstore attestation proving the package was built from this
# repo + commit — the strongest supply-chain guarantee npm offers.
#
# One-time setup: add an npm automation token as the repo secret NPM_TOKEN
# (npmjs.com → Access Tokens → Generate → "Automation"). Publishing is gated on the tests.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for npm provenance (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Test before publish
        run: node --test
      - name: Publish (public, with provenance)
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
