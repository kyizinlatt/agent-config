name: Publish to npm

# Publishes when you create a GitHub Release (or run manually via workflow_dispatch).
#
# Auth: npm Trusted Publishing (OIDC) — NO GitHub Environment, NO NPM_TOKEN.
# One-time setup on https://www.npmjs.com/package/agent-pipx → Settings → Trusted Publisher:
#   Organization or user : kyizinlatt
#   Repository           : agent-pipx
#   Workflow filename    : publish.yml
#   Environment name     : (leave BLANK — this repo does not use GitHub Environments)
#   Allowed actions      : npm publish
#
# Requires npm CLI ≥ 11.5.1 and Node ≥ 22.14 for OIDC.
# Do NOT leave setup-node's default NODE_AUTH_TOKEN (github.token) in place — it makes npm
# try token auth and skip/break OIDC, which surfaces as E404 on PUT for existing packages.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC for npm trusted publishing + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    # Intentionally no `environment:` — repo secrets / Environments are not used for publish.
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          # No registry-url here — that writes an .npmrc with _authToken=${NODE_AUTH_TOKEN}
          # defaulting to github.token, which breaks trusted publishing.
          package-manager-cache: false

      # Trusted publishing needs npm ≥ 11.5.1 (Node 22 ships an older npm).
      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@latest

      - name: Test before publish
        run: node --test

      - name: Publish (public, provenance via OIDC)
        # Explicitly clear any token pollution; OIDC is the only auth path.
        env:
          NODE_AUTH_TOKEN: ''
        run: |
          npm config delete //registry.npmjs.org/:_authToken || true
          npm publish --provenance --access public
