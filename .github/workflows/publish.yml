name: Publish to npm

# Publishes when you create a GitHub Release (or run manually via workflow_dispatch).
#
# Auth: npm Trusted Publishing (OIDC) — NO GitHub Environment, NO NPM_TOKEN.
# One-time setup on https://www.npmjs.com/package/agent-pipx → Settings → Trusted Publisher:
#   Organization or user : kyizinlatt
#   Repository           : agent-pipx
#   Workflow filename    : publish.yml
#   Environment name     : (leave BLANK — do NOT put "npm publish" here)
#   Allowed actions      : Allow `npm publish`
#
# Requires npm CLI ≥ 11.5.1. setup-node's registry-url writes an .npmrc authToken line
# defaulting to github.token — that MUST be stripped or OIDC never runs (ENEEDAUTH / E404).
# Never set NODE_AUTH_TOKEN to "" either — empty string also disables OIDC.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC for npm trusted publishing + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    # Intentionally no `environment:` — must match blank Environment on npm Trusted Publisher.
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@latest

      # Release tags must match package.json (v0.4.10 → 0.4.10). Skipped on workflow_dispatch.
      - name: Assert package version matches release tag
        if: github.event_name == 'release'
        run: |
          set -euo pipefail
          tag="${{ github.event.release.tag_name }}"
          expected="${tag#v}"
          actual=$(node -p "require('./package.json').version")
          if [ "$actual" != "$expected" ]; then
            echo "package.json version ($actual) != release tag ($tag → $expected)"
            exit 1
          fi
          echo "version ok: $actual (tag $tag)"

      - name: Test before publish
        run: node --test

      - name: Publish (public, provenance via OIDC)
        run: |
          set -euo pipefail
          # Keep registry from setup-node; drop the github.token authToken line.
          if [ -n "${NPM_CONFIG_USERCONFIG:-}" ] && [ -f "$NPM_CONFIG_USERCONFIG" ]; then
            grep -v '_authToken' "$NPM_CONFIG_USERCONFIG" > "${NPM_CONFIG_USERCONFIG}.oidc" || true
            mv "${NPM_CONFIG_USERCONFIG}.oidc" "$NPM_CONFIG_USERCONFIG"
            echo "npmrc after strip:"
            cat "$NPM_CONFIG_USERCONFIG" || true
          fi
          # Must unset (not empty-string) or npm skips OIDC.
          unset NODE_AUTH_TOKEN
          npm publish --provenance --access public
